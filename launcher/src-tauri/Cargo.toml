[package]
name = "devstribution-launcher"
description = "The devstribution launcher: installs, verifies and runs devstribution apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "devstribution_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
devstribution-core.workspace = true
devstribution-host.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = "2"
