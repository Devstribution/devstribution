[package]
name = "devstribution-launcher"
description = "The devstribution launcher: installs, verifies and runs devstribution apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "devstribution_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
devstribution-core.workspace = true
devstribution-host.workspace = true
dunce = "1.0.5"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader"] }
