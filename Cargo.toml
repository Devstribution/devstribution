[workspace]
resolver = "3"
members = [
    "crates/devstribution-core",
    "crates/devstribution-host",
    "crates/devstribution-cli",
    "launcher/src-tauri",
]
# The launcher needs the WebView system libraries; `cargo test` at the root skips it.
default-members = ["crates/devstribution-core", "crates/devstribution-host", "crates/devstribution-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devstribution/devstribution"
rust-version = "1.90"

[workspace.dependencies]
devstribution-core = { path = "crates/devstribution-core" }
devstribution-host = { path = "crates/devstribution-host" }
