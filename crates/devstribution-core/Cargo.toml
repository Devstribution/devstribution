[package]
name = "devstribution-core"
description = "Package format, signing and verification for devstribution apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
ignore = "0.4.33"
minisign = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
