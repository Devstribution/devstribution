[package]
name = "devstribution-cli"
description = "Developer tools for devstribution apps: init, dev, pack, keygen, verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "devstribution"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
devstribution-core.workspace = true
devstribution-host.workspace = true
dirs = "7.0.0"
hex = "0.4.3"
rpassword = "7.5.4"
serde_json = "1.0.154"
sha2 = "0.11.0"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.2.2"
serde_json = "1.0.154"
tempfile = "3.27.0"
