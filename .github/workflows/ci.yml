name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (a tag can be moved to other code); Dependabot proposes
# updates. This matters more once the workflow signs releases.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test

      - name: Runner tests (Python 3.11)
        run: uv run --no-project --python 3.11 python -m unittest discover -s runner/tests -v
      - name: Runner tests (Python 3.13)
        run: uv run --no-project --python 3.13 python -m unittest discover -s runner/tests -v

  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux WebView libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: UI type check and build
        run: npm run build
      - name: uv sidecar
        run: npm run sidecar
      - name: Launcher lint
        run: cargo clippy -p devstribution-launcher --all-targets -- -D warnings

  audit:
    # Known vulnerabilities in the Rust and npm dependencies fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: npm audit
        working-directory: launcher
        run: npm audit --omit=dev --audit-level=moderate
